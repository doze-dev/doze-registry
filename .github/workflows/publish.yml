# Sign + publish module releases into the signed registry.
#
# The registry PULLS. On a schedule it looks at each module's source release (the repo
# in registry/doze/<name>/source, or doze-modules when there is none) and signs any
# version the registry does not have yet. A product that ships its own module
# (doze-aws, doze-kafka) only uploads a GitHub release; it needs no token here.
#
# It can also be run now: by a repository_dispatch from a release workflow (doze-modules
# still does this; the payload's "sources" map is remembered as the module's source), or
# manually, which re-signs the named modules or the full set (reconciliation).
#
# The ed25519 signing key lives ONLY here, as an Actions secret
# (DOZE_SIGNING_KEY) that matches the committed registry/doze/keys.json — so
# signing happens where the key is, and doze-modules never needs it.
#
# The job re-runs the same publish + validate scripts a human would, then commits
# the signed index.yaml files. The push to main triggers the existing deploy.yml,
# which is the single Cloudflare deploy path.
name: publish

on:
  schedule:
    - cron: '17 * * * *' # hourly
  repository_dispatch:
    types: [modules-published]
  workflow_dispatch:
    inputs:
      modules:
        description: 'Space-separated module names to (re)sign, or "all"'
        required: false
        default: all

permissions:
  contents: write
  actions: write # to chain the deploy workflow after the bot commit

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The publish/validate scripts import only 'yaml'; skip the full (astro)
      # dependency tree — this job signs text files, it doesn't build the site.
      - name: Install script dependencies
        run: npm install --no-save yaml

      # Resolve the module set: the dispatch payload is a JSON array; the manual
      # input is a space-separated list or "all" (every module DIRECTORY on disk —
      # not keys.json). Names are space-joined: a multiline value interpolated
      # into the `for` below is a bash syntax error.
      - name: Resolve module set
        id: set
        env:
          PAYLOAD: '${{ toJSON(github.event.client_payload.modules) }}'
          INPUT: '${{ github.event.inputs.modules }}'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # What is new: a version in the source's release index the registry lacks.
            # A source with no release yet (404) is simply nothing new.
            names=""
            for dir in registry/doze/*/; do
              name=$(basename "$dir")
              src=doze-dev/doze-modules
              [ -f "registry/doze/$name/source" ] && src=$(cat "registry/doze/$name/source")
              curl -sfL "https://github.com/$src/releases/download/$name/index.yaml" -o /tmp/release.yaml || continue
              for v in $(yq '.releases | keys | .[]' /tmp/release.yaml); do
                if ! yq -e ".releases.\"$v\"" "registry/doze/$name/index.yaml" >/dev/null 2>&1; then
                  names="$names $name"
                  break
                fi
              done
            done
            names=$(echo $names | xargs)
            echo "new releases: ${names:-none}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Tolerate both a real JSON array and a stringified one (older
            # senders used `gh api -f`, which stringifies everything).
            names=$(echo "$PAYLOAD" | jq -r 'if type == "string" then fromjson else . end | .[]' | xargs)
            [ -n "$names" ] || { echo "dispatch payload contained no module names"; exit 1; }
          elif [ "${INPUT:-all}" = "all" ] || [ -z "${INPUT:-}" ]; then
            names=$(find registry/doze -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | xargs)
          else
            names="$INPUT"
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"

      # The dispatch payload's versions map (when present) tells the signer which
      # release each module index must contain — publish.mjs retries the fetch
      # until the asset CDN serves it, instead of signing a stale index.
      # One module that can't publish (an index refused for changing a published
      # version, say) must not hold back the rest: each is tried, the ones that
      # failed are named, and the run fails at the end, after the others commit.
      - name: Sign + publish each module
        id: publish
        if: steps.set.outputs.names != ''
        env:
          DOZE_SIGNING_KEY: '${{ secrets.DOZE_SIGNING_KEY }}'
          VERSIONS: '${{ toJSON(github.event.client_payload.versions) }}'
          SOURCES: '${{ toJSON(github.event.client_payload.sources) }}'
        run: |
          failed=""
          for name in ${{ steps.set.outputs.names }}; do
            expect=$(echo "${VERSIONS:-null}" | jq -r --arg n "$name" 'if type == "string" then fromjson else . end | .[$n]? // empty' 2>/dev/null || true)
            # A module released from its product's repo says where (owner/repo); the
            # rest are doze-modules'. It is remembered beside the index, so a manual
            # re-sign of the full set reads the same release again.
            src=$(echo "${SOURCES:-null}" | jq -r --arg n "$name" 'if type == "string" then fromjson else . end | .[$n]? // empty' 2>/dev/null || true)
            [ -n "$src" ] && echo "$src" > "registry/doze/$name/source"
            [ -z "$src" ] && [ -f "registry/doze/$name/source" ] && src=$(cat "registry/doze/$name/source")
            base=${src:+https://github.com/$src/releases/download/$name}
            echo "::group::publish doze/$name ${expect:+(expect $expect)} ${src:+from $src}"
            if ! node scripts/publish.mjs "doze/$name" ${expect:+--expect "$expect"} ${base:+--release-base "$base"}; then
              git checkout -- "registry/doze/$name" 2>/dev/null || true
              failed="$failed $name"
              echo "::error::doze/$name was not published"
            fi
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      # Offline gate: structure + every signature. Then the trust gate: re-download
      # each archive and confirm its SHA256 matches the signed value.
      - name: Validate signatures, and that nothing published was lost
        if: steps.set.outputs.names != ''
        run: node scripts/validate.mjs --against=HEAD

      - name: Validate archives (remote)
        if: steps.set.outputs.names != ''
        run: npm run validate:remote

      - name: Commit signed indexes
        id: commit
        if: steps.set.outputs.names != ''
        run: |
          git config user.name  "doze-registry-bot"
          git config user.email "bot@doze.dev"
          git add registry/
          if git diff --cached --quiet; then
            echo "no registry changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "publish: sign ${{ steps.set.outputs.names }} into the registry"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does NOT trigger other workflows (GitHub's
      # recursion guard), so the bot commit above would never deploy on its own.
      # workflow_dispatch is exempt from that guard — chain the deploy explicitly.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy --repo "$GITHUB_REPOSITORY"

      - name: Fail for the modules that did not publish
        if: steps.publish.outputs.failed != ''
        run: |
          echo "::error::not published: ${{ steps.publish.outputs.failed }}"
          exit 1

name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish the signed registry data to the Cloudflare Pages project
# `doze-registry` (registry.doze-dev.com) as plain static files, then ask the
# website (doze-dev.com/registry, the only portal) to rebuild from it.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  the Pages deploy (required)
#   WEBSITE_DISPATCH_TOKEN                       the website rebuild (optional):
#     a fine-grained token with Contents: read and write on doze-dev/doze-website
#     (what POST /repos/{owner}/{repo}/dispatches needs). Without it the step
#     says so and skips; the website's nightly build picks the change up.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=doze-registry --branch=main

      - name: Ask the website to rebuild its registry pages
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::WEBSITE_DISPATCH_TOKEN is not set; skipping the website rebuild (its nightly build will pick this up)"
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/doze-dev/doze-website/dispatches \
            -d "{\"event_type\":\"registry-published\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
          echo "asked doze-dev/doze-website to rebuild (registry-published, $GITHUB_SHA)"
